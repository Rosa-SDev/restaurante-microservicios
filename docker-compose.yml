name: restaurante

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      USUARIOS_DB_PASSWORD: ${USUARIOS_DB_PASSWORD}
      CARTA_DB_PASSWORD: ${CARTA_DB_PASSWORD}
      CLIENTES_DB_PASSWORD: ${CLIENTES_DB_PASSWORD}
      SALON_DB_PASSWORD: ${SALON_DB_PASSWORD}
      PAGOS_DB_PASSWORD: ${PAGOS_DB_PASSWORD}
      TZ: America/Bogota
    volumes:
      - mysql-datos:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:30180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      PAGOS_CLIENTE_SECRET: ${PAGOS_CLIENTE_SECRET}
      PAGOS_CONSULTA_SECRET: ${PAGOS_CONSULTA_SECRET}
      TZ: America/Bogota
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "30180:8080"
    mem_limit: 1g

  usuarios-service:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
    image: restaurante/usuarios-service:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      DB_URL: jdbc:mysql://mysql:3306/usuariosdb?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: usuarios
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD}
      JWT_CLAVE_PRIVADA: file:/claves/privada.pem
      JWT_CLAVE_PUBLICA: file:/claves/publica.pem
    volumes:
      - ./claves:/claves:ro
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy

  carta-service:
    build:
      context: .
      dockerfile: carta-service/Dockerfile
    image: restaurante/carta-service:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      DB_URL: jdbc:mysql://mysql:3306/cartadb?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: carta
      DB_PASSWORD: ${CARTA_DB_PASSWORD}
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy

  clientes-service:
    build:
      context: .
      dockerfile: clientes-service/Dockerfile
    image: restaurante/clientes-service:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      DB_URL: jdbc:mysql://mysql:3306/clientesdb?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: clientes
      DB_PASSWORD: ${CLIENTES_DB_PASSWORD}
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy

  salon-service:
    build:
      context: .
      dockerfile: salon-service/Dockerfile
    image: restaurante/salon-service:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      DB_URL: jdbc:mysql://mysql:3306/salondb?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: salon
      DB_PASSWORD: ${SALON_DB_PASSWORD}
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy

  pagos-service:
    build:
      context: .
      dockerfile: pagos-service/Dockerfile
    image: restaurante/pagos-service:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      DB_URL: jdbc:mysql://mysql:3306/pagosdb?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: pagos
      DB_PASSWORD: ${PAGOS_DB_PASSWORD}
      OAUTH_ISSUER_URI: http://localhost:30180/realms/restaurante
      OAUTH_JWKS_URI: http://keycloak:8080/realms/restaurante/protocol/openid-connect/certs
    mem_limit: 512m
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: restaurante/api-gateway:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Bogota
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      JWT_CLAVE_PUBLICA: file:/claves/publica.pem
      OAUTH_ISSUER_URI: http://localhost:30180/realms/restaurante
      OAUTH_JWKS_URI: http://keycloak:8080/realms/restaurante/protocol/openid-connect/certs
    volumes:
      - ./claves/publica.pem:/claves/publica.pem:ro
    ports:
      - "8080:8080"
    mem_limit: 384m
    depends_on:
      - usuarios-service
      - carta-service
      - clientes-service
      - salon-service
      - pagos-service
      - keycloak

volumes:
  mysql-datos:
