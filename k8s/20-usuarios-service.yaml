apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-service
  namespace: restaurante
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios-service
  template:
    metadata:
      labels:
        app: usuarios-service
    spec:
      enableServiceLinks: false
      containers:
        - name: usuarios-service
          image: restaurante/usuarios-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: TZ
              value: America/Bogota
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/usuariosdb?useSSL=false&allowPublicKeyRetrieval=true
            - name: DB_USER
              value: usuarios
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restaurante-secretos
                  key: USUARIOS_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: restaurante-secretos
                  key: JWT_SECRET
          resources:
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-service
  namespace: restaurante
spec:
  type: ClusterIP
  selector:
    app: usuarios-service
  ports:
    - port: 8081
      targetPort: 8081
