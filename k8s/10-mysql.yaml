apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-datos
  namespace: restaurante
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: restaurante
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      enableServiceLinks: false
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: restaurante-secretos
          env:
            - name: TZ
              value: America/Bogota
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
            - name: inicializacion
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: mysql-datos
        - name: inicializacion
          configMap:
            name: mysql-inicializacion
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: restaurante
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
