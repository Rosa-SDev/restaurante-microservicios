apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: restaurante
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: restaurante/api-gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: TZ
              value: America/Bogota
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            - name: JWT_CLAVE_PUBLICA
              value: file:/claves/publica.pem
            - name: OAUTH_ISSUER_URI
              value: http://localhost:30180/realms/restaurante
            - name: OAUTH_JWKS_URI
              value: http://keycloak:8080/realms/restaurante/protocol/openid-connect/certs
          volumeMounts:
            - name: claves
              mountPath: /claves
              readOnly: true
          resources:
            limits:
              memory: 384Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: claves
          secret:
            secretName: restaurante-claves
            items:
              - key: publica.pem
                path: publica.pem
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: restaurante
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
