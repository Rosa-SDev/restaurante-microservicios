spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
  h2:
    console:
      enabled: false

seguridad:
  jwt:
    clave-privada: ${JWT_CLAVE_PRIVADA}
    clave-publica: ${JWT_CLAVE_PUBLICA}