spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: usuarios
              uri: http://usuarios-service:8081
              predicates:
                - Path=/api/usuarios/**,/api/auth/**

            - id: carta
              uri: http://carta-service:8082
              predicates:
                - Path=/api/platillos/**

            - id: clientes
              uri: http://clientes-service:8083
              predicates:
                - Path=/api/clientes/**,/api/reservas/**

            - id: salon
              uri: http://salon-service:8084
              predicates:
                - Path=/api/mesas/**,/api/pedidos/**,/api/facturas/**

seguridad:
  jwt:
    secreto: ${JWT_SECRET}
