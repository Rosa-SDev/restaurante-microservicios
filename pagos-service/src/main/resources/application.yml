server:
  port: 8085

spring:
  application:
    name: pagos-service

  datasource:
    url: jdbc:h2:mem:pagosdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:30180/realms/restaurante
          jwk-set-uri: http://localhost:30180/realms/restaurante/protocol/openid-connect/certs
          audiences: pagos-api

